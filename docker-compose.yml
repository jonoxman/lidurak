services:
  freebuff-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: freebuff_worker
    working_dir: /workspace
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/durak
      - SBT_OPTS=-Xmx4G -XX:+UseG1GC
    ports:
      # Bound strictly to 127.0.0.1 so you can test in your Windows browser
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5173:5173"
    volumes:
      - ./:/workspace:rw
      - freebuff_auth:/home/node/.config
      - sbt_cache:/home/node/.cache
      - sbt_boot:/home/node/.sbt
    depends_on:
      - mongodb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 14G
    stdin_open: true
    tty: true
    command: tail -f /dev/null

  mongodb:
    image: mongo:7.0
    container_name: durak_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # No ports exposed to host needed; accessible to sandbox at mongodb:27017
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

volumes:
  freebuff_auth:
  sbt_cache:
  sbt_boot:
  mongo_data:
